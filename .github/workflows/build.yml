name: build

# Builds standalone executables with PyInstaller.
# - Every push to main: binaries are uploaded as workflow artifacts.
# - Pushing a tag like v0.1.0: binaries are also attached to a GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-latest
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install . pyinstaller pytest
          pytest -q

      - name: Build console executable
        run: pyinstaller --onefile --name clipguard --paths src packaging/entry.py

      - name: Build background executable (Windows, no console window)
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --noconsole --name clipguard-background --paths src packaging/entry.py

      - name: Smoke test
        shell: bash
        run: |
          ./dist/clipguard --version
          printf 'card 4111 1111 1111 1111\n' | ./dist/clipguard scan - || test $? -eq 1

      - name: Package
        shell: bash
        run: |
          mkdir out
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/clipguard.exe out/clipguard-${{ matrix.name }}.exe
            cp dist/clipguard-background.exe out/clipguard-background-${{ matrix.name }}.exe
          else
            cp dist/clipguard out/clipguard-${{ matrix.name }}
            chmod +x out/*
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: clipguard-${{ matrix.name }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ClipGuard ${GITHUB_REF_NAME}" \
            --notes "Standalone executables, no Python needed. On Windows, download clipguard-background-windows-x64.exe to run silently, or clipguard-windows-x64.exe to see output in a console."
