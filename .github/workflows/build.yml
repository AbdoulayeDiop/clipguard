name: build

# Builds standalone executables with PyInstaller.
# - Every push to main: binaries are uploaded as workflow artifacts.
# - Pushing a tag like v0.1.0: binaries are also attached to a GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-latest
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install . pyinstaller pytest
          pytest -q

      - name: Build console executable
        run: pyinstaller --onefile --name clipguard --paths src packaging/entry.py

      - name: Build background executable (Windows, no console window)
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --noconsole --name clipguard-background --paths src packaging/entry.py

      - name: Smoke test
        shell: bash
        run: |
          ./dist/clipguard --version
          printf 'card 4111 1111 1111 1111\n' | ./dist/clipguard scan - || test $? -eq 1

      - name: Package
        shell: bash
        run: |
          mkdir out
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/clipguard.exe out/clipguard-${{ matrix.name }}.exe
            cp dist/clipguard-background.exe out/clipguard-background-${{ matrix.name }}.exe
          else
            cp dist/clipguard out/clipguard-${{ matrix.name }}
            chmod +x out/*
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: clipguard-${{ matrix.name }}
          path: out/*

  release:
    # Runs for version tags, or when started manually from the Actions tab
    # (the tag is then taken from __version__ in src/clipguard/__init__.py).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Pick tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/clipguard/__init__.py)
            echo "TAG=v${v}" >> "$GITHUB_ENV"
          fi
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          gh release create "$TAG" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ClipGuard ${TAG}" \
            --notes "Standalone executables, no Python needed. On Windows, download clipguard-background-windows-x64.exe to run silently, or clipguard-windows-x64.exe to see output in a console."
